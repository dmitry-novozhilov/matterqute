<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@600&amp;display=swap">
</helmet>
<div style="position:relative;width:{{ size }}px;height:{{ size }}px;flex:none">
  <div style="width:192px;height:192px;zoom:{{ z }};margin:{{ m }};position:relative;border-radius:44px;background:{{ tile }};overflow:hidden">
    <sc-if value="{{ isQ }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:38px;top:38px;width:116px;height:116px;box-sizing:border-box;border-radius:58px 58px 14px 58px;border:22px solid {{ g }}"></div>
    </sc-if>
    <sc-if value="{{ isHash }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:34px;top:38px;width:124px;height:108px;border-radius:54px 54px 54px 12px;background:{{ g }};display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans',sans-serif;font-size:72px;line-height:72px;font-weight:600;color:{{ cut }}">#</div>
    </sc-if>
    <sc-if value="{{ isFeed }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:38px;top:46px;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;align-items:center;gap:12px"><span style="width:24px;height:24px;border-radius:50%;background:{{ g2 }}"></span><span style="width:78px;height:14px;border-radius:7px;background:{{ g2 }}"></span></div>
        <div style="display:flex;align-items:center;gap:12px"><span style="width:24px;height:24px;border-radius:50%;background:{{ g2 }}"></span><span style="width:56px;height:14px;border-radius:7px;background:{{ g2 }}"></span></div>
        <div style="display:flex;align-items:center;gap:12px"><span style="width:24px;height:24px;border-radius:50%;background:{{ g }}"></span><span style="width:92px;height:14px;border-radius:7px;background:{{ g }}"></span></div>
      </div>
    </sc-if>
    <sc-if value="{{ isMq }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:22px;box-sizing:border-box;font-family:'IBM Plex Sans',sans-serif;font-size:104px;line-height:104px;font-weight:600;letter-spacing:-5px;color:{{ g }}">mq</div>
    </sc-if>
    <sc-if value="{{ isDuo }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:28px;top:34px;width:92px;height:92px;border-radius:50%;background:{{ g2 }}"></div>
      <div style="position:absolute;left:66px;top:62px;width:100px;height:96px;border-radius:48px 48px 12px 48px;background:{{ g }};display:flex;align-items:center;justify-content:center;gap:10px"><span style="width:16px;height:16px;border-radius:50%;background:{{ cut }}"></span><span style="width:16px;height:16px;border-radius:50%;background:{{ cut }}"></span><span style="width:16px;height:16px;border-radius:50%;background:{{ cut }}"></span></div>
    </sc-if>
  </div>
  <sc-if value="{{ badge }}" hint-placeholder-val="{{ false }}">
    <span style="position:absolute;right:{{ bo }}px;top:{{ bo }}px;min-width:{{ bs }}px;height:{{ bs }}px;box-sizing:border-box;padding:0 3px;border-radius:{{ bs }}px;background:{{ bbg }};color:{{ bc }};font-family:'IBM Plex Sans',sans-serif;font-size:{{ bf }}px;line-height:{{ bs }}px;font-weight:600;text-align:center">{{ badge }}</span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:220},&quot;concept&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;q&quot;,&quot;hash&quot;,&quot;feed&quot;,&quot;mq&quot;,&quot;duo&quot;],&quot;default&quot;:&quot;q&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:192,&quot;tsType&quot;:&quot;number&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;color&quot;,&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;color&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;badge&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const c = this.props.concept || 'q';
    const size = Number(this.props.size) || 192;
    const mode = this.props.mode || 'color';
    const mono = mode !== 'color';
    const ink = mode === 'dark' ? '#e9e6e1' : '#211d18';
    const panel = mode === 'dark' ? '#1b1916' : '#eeebe6';
    const crop = 140;
    return {
      size, badge: this.props.badge || '',
      isQ: c === 'q', isHash: c === 'hash', isFeed: c === 'feed', isMq: c === 'mq', isDuo: c === 'duo',
      z: mono ? size / crop : size / 192,
      m: mono ? `-${(192 - crop) / 2}px` : '0',
      tile: mono ? 'transparent' : '#008a67',
      g: mono ? ink : '#fcfbf9',
      g2: mono ? ink : '#9fdcc2',
      cut: mono ? panel : '#008a67',
      bs: size <= 24 ? 12 : 18, bf: size <= 24 ? 9 : 11, bo: size <= 24 ? -4 : -5,
      bbg: mode === 'dark' ? '#ea6b60' : '#c13c36', bc: mode === 'dark' ? '#1b1916' : '#fcfcfc'
    };
  }
}
</script>
</body>
</html>
